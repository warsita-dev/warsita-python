openapi: 3.1.0
info:
  title: Warsita API
  version: "1.0"
  summary: Send and receive WhatsApp messages over HTTP.
  description: |
    Warsita links a WhatsApp number as a linked device (like WhatsApp Web) and exposes it as a REST API:
    send messages with a session API key, manage sessions with a personal access token, and receive
    events by signed webhook. Guides: https://warsita.com/docs

    Two credentials, both sent as `Authorization: Bearer …`:

    - **Session API key** (`wsk_…`): one per session, for messages, media, the account, contacts and
      groups. The key picks the session.
    - **Personal access token** (`wsp_…`): one per workspace, for everything. Endpoints that act on a
      session's WhatsApp account then need `session_id`.

    Errors are JSON: `{"error": {"code": "…", "message": "…"}}`.

    Official SDKs (Node.js, Python, PHP), an MCP server for AI agents (`https://api.warsita.com/mcp`) and
    n8n nodes wrap this API: https://warsita.com/docs/sdks
  contact:
    email: hello@warsita.com
servers:
  - url: https://api.warsita.com
security:
  - personalAccessToken: []
tags:
  - name: Messages
    description: Send messages and follow their status.
  - name: Media
    description: Upload files to send, and download received media.
  - name: Account
    description: The linked WhatsApp account and its presence.
  - name: Contacts
    description: Look up WhatsApp accounts.
  - name: Groups
    description: Groups the session's account belongs to, and managing them.
  - name: Sessions
    description: Link, manage and monitor WhatsApp numbers. Personal access token only.
  - name: Webhook
    description: Where a session's events are delivered. Personal access token only.
  - name: Health
    description: Whether the API is up.
paths:
  /v1/messages:
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Send a message
      description: |
        Queues a message and answers at once with `status: "queued"`. The session sends it in the
        background; follow it with `GET /v1/messages/{id}` or the `message.sent` and
        `message-receipt.update` webhooks. The type follows from the field you send: `text`, or exactly
        one of `image`, `video`, `audio`, `document`, `sticker`, `location`, `contact`, `poll`. Media is downloaded from its
        URL when the message is sent (images up to 16 MB, other media up to 64 MB); a download that fails
        marks the message `failed`.

        Send an `Idempotency-Key` to make retries safe: repeating the request with the same key returns
        the message the first request queued, with `Idempotent-Replayed: true`, instead of sending it again.

        A phone number that opted out of the workspace's messages (it replied STOP, or someone marked it
        in the dashboard's Contacts) is refused with `422` and `recipient_opted_out`, whichever number
        sends.

        With a personal access token, `rotate: true` (instead of `session_id`) sends to a person from the
        workspace's sender rotation: of its connected sessions with the `rotation` setting on, the one
        that has not written to them yet, or that did longest ago. The answer adds `from`, the number it
        goes out from. If that session drops before sending, the message moves to another one in rotation.
        A recipient gets at most the workspace's limit of such messages in 24 hours (5 unless an owner
        changed it); over it the request answers `429` with `recipient_limit`.

        On the free trial, `rotate` is refused with `403` and `trial_limit`, and so is every message
        after the 100th in 24 hours, with `429` and `trial_limit`, until the count drops.
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: |
            A unique value per message, such as an order ID or a UUID (up to 255 printable ASCII characters).
            Keys belong to the session (with `rotate`, to the workspace) and are remembered as long as the
            message is in its log (30 days, or until the log is cleared). The same key with a different
            request is refused with `422`.
          schema: { type: string, maxLength: 255, examples: ["order-1042-shipped"] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessage" }
            examples:
              text:
                summary: Text
                value: { to: "+6281234567890", text: "Your order has shipped." }
              image:
                summary: Image with a caption
                value: { to: "+6281234567890", image: { url: "https://example.com/receipt.png", caption: "Receipt" } }
              reply:
                summary: Reply quoting a received message
                value: { to: "+6281234567890", text: "Yes, it ships today.", reply_to: { id: "3EB0A1B2C3D4E5F6", text: "Is my order on its way?" } }
              poll:
                summary: Poll
                value: { to: "120363012345678901@g.us", poll: { name: "Which day works?", options: ["Friday", "Saturday"], selectable_count: 1 } }
              group:
                summary: Group message with a mention
                value: { to: "120363012345678901@g.us", text: "Welcome @6281234567890!", mentions: ["+6281234567890"] }
              rotate:
                summary: From the workspace's sender rotation
                value: { rotate: true, to: "+6281234567890", text: "Your invoice INV-1042 is due on 1 November." }
      responses:
        "202":
          description: Queued, or the message an earlier request with the same `Idempotency-Key` queued.
          headers:
            Idempotent-Replayed:
              description: "`true` when this answer is a repeat of an earlier request with the same `Idempotency-Key`."
              schema: { type: string, enum: ["true"] }
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Message"
                      - type: object
                        properties:
                          from: { type: string, description: "With `rotate`: the number the message goes out from.", examples: ["+6281100000001"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/Suspended" }
        "403":
          description: "With `rotate` on the free trial (`trial_limit`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "With `rotate`: no session in rotation is connected (`no_sender_available`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            The `Idempotency-Key` was already used for a different message (`idempotency_key_reused`), or the
            recipient opted out of the workspace's messages (`recipient_opted_out`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            More than 600 requests in the current minute (`rate_limited`; retry after `Retry-After` seconds);
            with `rotate`, the recipient already got the workspace's daily limit (`recipient_limit`); or the
            free trial sent 100 messages in the last 24 hours (`trial_limit`).
          headers:
            Retry-After:
              description: "With `rate_limited`: seconds until the limit resets."
              schema: { type: integer, examples: [12] }
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [Messages]
      operationId: listMessages
      summary: List messages
      description: The session's messages, newest first. Page back with `before`, the `id` of the last message you got.
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      parameters:
        - $ref: "#/components/parameters/SessionIDQuery"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/MessageStatus" }
        - name: before
          in: query
          description: A message id; returns the messages older than it.
          schema: { type: string, examples: ["msg_8sJq2LwP0aZx4TnB6kRv"] }
      responses:
        "200":
          description: Messages.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Message" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/messages/{id}:
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Get a message
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, examples: ["msg_8sJq2LwP0aZx4TnB6kRv"] }
        - name: session_id
          in: query
          description: Not needed and ignored. A personal access token reads any message it may see, including those sent with `rotate`; an API key reads its own session's.
          schema: { type: string, examples: ["ses_3kV9mQ2pX7aL0zR5tN8w"] }
      responses:
        "200":
          description: The message.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Message" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      tags: [Messages]
      operationId: editMessage
      summary: Edit a sent message
      description: Changes the text of a text message the session sent, within 20 minutes of sending. Recipients see it marked as edited; the message log keeps the original text.
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, examples: ["msg_8sJq2LwP0aZx4TnB6kRv"] }
        - $ref: "#/components/parameters/SessionIDQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 65536 }
      responses:
        "204":
          description: Edited.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not sent yet (`not_sent`), or not a text message or older than 20 minutes (`not_editable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WhatsAppError" }
        "504": { $ref: "#/components/responses/RuntimeTimeout" }
    delete:
      tags: [Messages]
      operationId: deleteMessage
      summary: Delete a sent message for everyone
      description: Deletes a message the session sent for everyone in the chat ("This message was deleted"). It stays in the message log.
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, examples: ["msg_8sJq2LwP0aZx4TnB6kRv"] }
        - $ref: "#/components/parameters/SessionIDQuery"
      responses:
        "204":
          description: Deleted for everyone.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not sent yet (`not_sent`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WhatsAppError" }
        "504": { $ref: "#/components/responses/RuntimeTimeout" }
  /v1/messages/{id}/resend:
    post:
      tags: [Messages]
      operationId: resendMessage
      summary: Resend a failed message
      description: Queues a failed message again as a new message with the same content. Failed messages keep their content for this until the log is deleted (30 days).
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, examples: ["msg_8sJq2LwP0aZx4TnB6kRv"] }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { $ref: "#/components/schemas/SessionIDField" }
      responses:
        "202":
          description: Queued as a new message.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Message" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/Suspended" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "The message did not fail, or it failed before 28 October 2026 when failed messages did not keep their content (`not_resendable`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The recipient opted out of the workspace's messages since (`recipient_opted_out`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/messages/react:
    post:
      tags: [Messages]
      operationId: reactToMessage
      summary: React to a message
      description: |
        Reacts with an emoji to a message the session sent (`message_id` is its `msg_…` id) or
        received (`message_id` is `id` from `messages.received`, with its `chat` and, in groups, its
        `sender`). An empty `emoji` removes the reaction.
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id, emoji]
              properties:
                session_id: { $ref: "#/components/schemas/SessionIDField" }
                message_id: { type: string, examples: ["3EB0A1B2C3D4E5F6"] }
                chat: { type: string, description: "The chat of a received message.", examples: ["6281234567890@s.whatsapp.net"] }
                sender: { type: string, description: "Who sent a received group message." }
                emoji: { type: string, examples: ["👍"] }
      responses:
        "204":
          description: Reaction sent.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A `msg_…` message that was not sent yet (`not_sent`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WhatsAppError" }
        "504": { $ref: "#/components/responses/RuntimeTimeout" }
  /v1/messages/read:
    post:
      tags: [Messages]
      operationId: markRead
      summary: Mark messages as read
      description: Sends read receipts (blue ticks) for received messages.
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, ids]
              properties:
                session_id: { $ref: "#/components/schemas/SessionIDField" }
                chat: { type: string, description: The chat's JID., examples: ["6281234567890@s.whatsapp.net"] }
                sender:
                  type: string
                  description: The sender's JID, needed in groups. Defaults to `chat`.
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: WhatsApp message ids (`id` from `messages.received`).
                  items: { type: string }
      responses:
        "204":
          description: Receipts sent.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WhatsAppError" }
        "504": { $ref: "#/components/responses/RuntimeTimeout" }
  /v1/media:
    post:
      tags: [Media]
      operationId: uploadMedia
      summary: Upload a file
      description: |
        Keeps a file of up to 30 MB for 7 days, to send with `media_id` in place of `url`. Send
        larger files by URL. With an API key, the file can be sent by that session; with a token,
        by any of the workspace's sessions.
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/MediaFile" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/Suspended" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/media/{id}:
    get:
      tags: [Media]
      operationId: getMedia
      summary: Get a file
      description: An uploaded file, or received media kept by `download_media`, with a link to download it for the next hour.
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, examples: ["med_4hT8kW2nQ9xZ1vB7cR5p"] }
      responses:
        "200":
          description: The file.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MediaFile" }
                  url: { type: string, format: uri, description: "Download link, valid for an hour." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/account:
    get:
      tags: [Account]
      operationId: getAccount
      summary: The linked account
      description: The WhatsApp account the session is linked to. Profile details (about, picture) are left out when WhatsApp does not share them.
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      parameters:
        - $ref: "#/components/parameters/SessionIDQuery"
      responses:
        "200":
          description: The account.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      jid: { type: string, examples: ["6281234567890@s.whatsapp.net"] }
                      lid: { type: string, examples: ["74869920260158@lid"] }
                      phone: { type: string, examples: ["+6281234567890"] }
                      push_name: { type: string, description: The name the account shows to others. }
                      about: { type: string }
                      business_name: { type: string }
                      picture_url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WhatsAppError" }
        "504": { $ref: "#/components/responses/RuntimeTimeout" }
  /v1/presence:
    post:
      tags: [Account]
      operationId: setPresence
      summary: Show the account online or offline
      description: |
        `available` shows the account as online to its contacts, `unavailable` as offline. With the
        session setting `always_online`, the account is set available again whenever it reconnects.
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                session_id: { $ref: "#/components/schemas/SessionIDField" }
                state: { type: string, enum: [available, unavailable] }
      responses:
        "204":
          description: Done.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WhatsAppError" }
        "504": { $ref: "#/components/responses/RuntimeTimeout" }
  /v1/presence/chat:
    post:
      tags: [Account]
      operationId: setChatPresence
      summary: Show typing or recording in a chat
      description: |
        Shows "typing…" (`typing`) or "recording audio…" (`recording`) in a chat until you send
        `paused` or a message, or WhatsApp clears it after a few seconds.
      security:
        - sessionApiKey: []
        - personalAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, state]
              properties:
                session_id: { $ref: "#/components/schemas/SessionIDField" }
                chat: { type: string, description: A phone number or a person's or group's JID., examples: ["+6281234567890"] }
                state: { type: string, enum: [typing, recording, paused] }
      responses:
        "204":
          description: Done.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
